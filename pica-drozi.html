<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pica droži</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2d3748; background: #fdfbf7;
    }
    .container { width: 100%; max-width: 760px; }
    .back-link { display: inline-block; margin-bottom: 16px; color: #9b2c2c; font-weight: 700; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .card {
      padding: 32px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff;
      box-shadow: 0 8px 22px rgba(45,55,72,.07); text-align: center;
    }
    .icon { font-size: 58px; line-height: 1; }
    h1 { margin: 14px 0 10px; color: #9b2c2c; }
    p { margin: 0; color: #718096; font-size: 17px; }
  </style>
</head>
<body>
  <main class="container">
    <a class="back-link" href="pica.html">← Nazaj na izbiro pice</a>
    <section class="card">
      <div class="icon" aria-hidden="true">🍕</div>
      <h1>Pica droži</h1>
      <p>Kalkulator za pico z drožmi bova nastavila po tvojem receptu.</p>
    </section>
  </main>
</body>
</html>
