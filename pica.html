<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Izbira vrste pice">
  <title>Izbira pice</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2d3748;
      background:
        radial-gradient(circle at top left, rgba(254, 178, 178, 0.35), transparent 34%),
        #fdfbf7;
    }
    .container { width: 100%; max-width: 900px; }
    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #9b2c2c;
      font-weight: 700;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    .header { margin-bottom: 28px; text-align: center; }
    .header h1 { margin: 0 0 8px; color: #9b2c2c; font-size: clamp(32px, 6vw, 46px); }
    .header p { margin: 0; color: #718096; font-size: 18px; }
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .recipe-card {
      min-height: 230px;
      padding: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(45, 55, 72, 0.07);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: inherit;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .recipe-card:hover,
    .recipe-card:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(155, 44, 44, 0.16);
      outline: 3px solid rgba(197, 48, 48, 0.18);
      outline-offset: 3px;
    }
    .icon { display: block; margin-bottom: 12px; font-size: 56px; line-height: 1; }
    h2 { margin: 0 0 8px; color: #9b2c2c; font-size: 25px; }
    .recipe-card p { margin: 0; color: #718096; font-size: 16px; }
    @media (max-width: 620px) {
      body { padding: 18px; }
      .recipe-grid { grid-template-columns: 1fr; }
      .recipe-card { min-height: 190px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">← Nazaj na izbiro receptov</a>
    <header class="header">
      <h1>🍕 Pica</h1>
      <p>Izberi vrsto testa.</p>
    </header>

    <section class="recipe-grid" aria-label="Izbira vrste pice">
      <a class="recipe-card" href="pica-klasika.html">
        <span class="icon" aria-hidden="true">🍕</span>
        <h2>Pica klasika</h2>
        <p>Klasično testo s kvasom in pekovskimi odstotki.</p>
      </a>

      <a class="recipe-card" href="pica-drozi.html">
        <span class="icon" aria-hidden="true">🍞</span>
        <h2>Pica droži</h2>
        <p>Testo za pico z drožmi.</p>
      </a>
    </section>
  </main>
</body>
</html>
